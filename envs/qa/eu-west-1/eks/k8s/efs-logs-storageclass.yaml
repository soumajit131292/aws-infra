# QA logs EFS StorageClass — QA's own logs file system, never prod's.
# Fill fileSystemId from the QA EKS stack:
#   cd envs/qa/eu-west-1/eks && terraform output -raw efs_logs_file_system_id
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-logs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: REPLACE_WITH_QA_EFS_LOGS_FILE_SYSTEM_ID
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/dynamic-provisioning"
mountOptions:
  - tls
reclaimPolicy: Retain
volumeBindingMode: Immediate
