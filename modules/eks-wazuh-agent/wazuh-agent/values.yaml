# Wazuh agent DaemonSet — one agent per node, reporting to an external manager
# (the Wazuh all-in-one EC2 in security/wazuh).

image:
  registry: docker.io
  repository: wazuh/wazuh-agent
  tag: 4.14.10
  pullPolicy: IfNotPresent

imagePullSecrets: []

manager:
  # Private IP / DNS of the Wazuh manager. REQUIRED.
  address: ""
  port: 1514      # agent reporting
  enrollmentPort: 1515

agent:
  # Wazuh group assigned at enrollment. Must exist on the manager
  # (created by the wazuh-server module's agent maintenance association).
  group: eks-prod
  # Static labels attached to every agent (shown in the dashboard).
  labels:
    cluster: ""
  # Host directory used to persist the agent key (client.keys) per node, so a
  # pod restart reuses the same registration instead of re-enrolling.
  keyHostPath: /var/lib/wazuh-agent

collect:
  # Plain-file node system logs, e.g. /host/var/log/messages and
  # /host/var/log/secure on AL2 nodes. Empty by default: AL2023 nodes log only
  # to journald, so these files do not exist and logcollector errors on them.
  systemLogs: []

  # Pod stdout/stderr logs, only for these namespaces. Node log files are named
  # /var/log/containers/<pod>_<namespace>_<container>-<id>.log. Keep this list
  # short: the manager indexes every event into wazuh-archives-* (logall_json
  # + archive indexing are on), so noisy namespaces fill the indexer volume.
  containerLogNamespaces: []

  # Node journald (AL2023 nodes log only to journald). Each filter becomes its
  # own <localfile> block, so entries are OR-ed: an event matching any one of
  # them is collected.
  journald:
    enabled: false
    filters:
      - field: _SYSTEMD_UNIT
        regex: '^sshd\.service$'
      - field: SYSLOG_IDENTIFIER
        regex: '^sudo$'

fim:
  enabled: true
  # Scan interval in seconds (12h).
  frequency: 43200
  directories:
    - /host/etc
    - /host/usr/bin
    - /host/usr/sbin
    - /host/bin
    - /host/sbin
  ignore:
    - /host/etc/mtab
    - /host/etc/hosts.deny
    - /host/etc/random-seed
    - /host/etc/adjtime

rootcheck:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Run on every node, including tainted ones.
tolerations:
  - operator: Exists

nodeSelector: {}

priorityClassName: system-node-critical

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
