apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accesshub-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/CraveGit/CRAVE_INT_ACCESSHUB_cicd.git
    targetRevision: main
    path: helm/accesshub
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
      parameters:
        - name: tenantBootstrap.enabled
          value: "false"
        - name: healthAggregator.enabled
          value: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: accesshub

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true