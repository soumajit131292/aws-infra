probes:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  limits:
    cpu: 100m
    memory: 3000Mi
  requests:
    cpu: 100m
    memory: 300Mi
persistentLogs:
  enabled: true
  # Region-local logs EFS. Independent from the data EFS so warm-standby pods in
  # the DR region can still write logs even when the data EFS is a read-only
  # replica.
  claimName: efs-logs-claim
  mountPath: /app/log
  subPath: logs
  excludedServices:
  - snowmodsvc
  - antdui
loginAuthSourcePersistence:
  enabled: true
  claimName: efs-claim
  service: loginmodsvc
  mountPath: /app/loginModule/registeredAuthenticationSource
  subPath: loginmodsvc/registeredAuthenticationSource
targetAppResourcesPersistence:
  enabled: true
  claimName: efs-claim
  mountPath: /app/TargetAppResources/resources/ApplicationRegistration
  subPath: targetappresources
  excludedServices:
  - antdui
schemaAssetsPersistence:
  enabled: true
  claimName: efs-claim
  schemaMapperMountPath: /app/schemaMapper
  schemaDefinitionMountPath: /app/SchemaDefinition
  subPath: schemaassets/common
  excludedServices:
  - antdui
accesshubFilesPersistence:
  enabled: true
  claimName: efs-claim
  mountPath: /app/Accesshub_Files
  subPath: accesshubfiles/common
  excludedServices:
  - antdui
authFilesPersistence:
  enabled: true
  claimName: efs-claim
  mountPath: /app/authfiles
  subPath: authfiles/common
tenantBootstrap:
  enabled: false
  trigger: ''
  ttlSecondsAfterFinished: null
  image:
    repository: ''
    digest: ''
dbMigration:
  enabled: false
  image:
    repository: accesshub/db-migration
    digest: sha256:f44a42917bf65be98c96f0950aebee3317b0c01a5aa2590ce495541b03155c61
healthAggregator:
  enabled: true
  replicaCount: 3
  image:
    repository: accesshub/health-aggregator
    digest: sha256:1519d91e84e442f3059e85152c18f1d876dee22e1293b69bdd1b84ace1728932
  resources:
    requests:
      cpu: 30m
      memory: 100Mi
    limits:
      cpu: 30m
      memory: 100Mi
  ingress:
    enabled: true
    path: /region-healthz
    pathType: Prefix
    healthCheckPath: /healthz
    