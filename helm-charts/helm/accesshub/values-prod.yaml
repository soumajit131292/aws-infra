ingress:
  enabled: true
  className: alb
  host: ''
  frontendHealthCheckPath: /accesshub/
  backendHealthCheckPath: /actuator/health
  backendHealthCheckPaths:
    ahschedular: /jobschedular/health
    scimpersist: /scim-application/health
    adminsvc: /privilegedrole/health
    apponbsvc: /itasset/health
    loginmodsvc: /RequestJWTToken/health
    gatewaysvc: /scim/health
    pgmodsvc: /pgmodule/health
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: accesshub-prod-alb
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=prod-accesshub-alb-access-logs-495711089104-eu-west-1,access_logs.s3.prefix=alb/accesshub,deletion_protection.enabled=true
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:eu-west-1:495711089104:regional/webacl/prod-accesshub-waf/5bcf94b5-9b96-4612-aae7-a5ec9f0bbf82
    alb.ingress.kubernetes.io/group.name: accesshub-prod
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:495711089104:certificate/fcfef919-bf02-4c47-9e75-b50e6800b3b6
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
  paths:
  - path: /accesshub
    pathType: Prefix
    service: antdui
  - path: /ahscheduler
    pathType: Prefix
    service: antdui
  - path: /scim
    pathType: Prefix
    service: gatewaysvc
  - path: /pgmodule
    pathType: Prefix
    service: pgmodsvc
  - path: /scimattribute
    pathType: Prefix
    service: pgmodsvc
  - path: /RequestJWTToken
    pathType: Prefix
    service: loginmodsvc
  - path: /authcontroller
    pathType: Prefix
    service: loginmodsvc
  - path: /login
    pathType: Prefix
    service: loginmodsvc
  - path: /itasset
    pathType: Prefix
    service: apponbsvc
  - path: /uiprivilege
    pathType: Prefix
    service: adminsvc
  - path: /privilegedrole
    pathType: Prefix
    service: adminsvc
  - path: /appRegMongoService
    pathType: Prefix
    service: adminsvc
  - path: /nativeusers
    pathType: Prefix
    service: adminsvc
  - path: /registerivapp
    pathType: Prefix
    service: adminsvc
  - path: /registerscimapp
    pathType: Prefix
    service: adminsvc
  - path: /registeredapp
    pathType: Prefix
    service: adminsvc
  - path: /schemamapper
    pathType: Prefix
    service: adminsvc
  - path: /servicenow
    pathType: Prefix
    service: snowmodsvc
  - path: /fulfillment
    pathType: Prefix
    service: snowmodsvc
  - path: /soap-api
    pathType: Prefix
    service: grcsoapws
  - path: /grcspml
    pathType: Prefix
    service: grcsoapws
  - path: /scim-application
    pathType: Prefix
    service: scimpersist
  - path: /jobschedular
    pathType: Prefix
