{{- if .Values.podDisruptionBudget.enabled }}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if eq (include "accesshub.deployService" (dict "enabled" $svc.enabled "digest" $svc.digest)) "true" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "accesshub.fullname" $root }}-{{ $name }}
  labels:
    {{- include "accesshub.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
{{- $ha := .Values.healthAggregator | default dict -}}
{{- $haRepo := default "" $ha.image.repository -}}
{{- $haDigest := default "" $ha.image.digest -}}
{{- $haDigestValid := eq (include "accesshub.validDigest" (dict "digest" $haDigest)) "true" -}}
{{- if and $ha.enabled (ne $haRepo "") $haDigestValid }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "accesshub.fullname" $root }}-health-aggregator
  labels:
    {{- include "accesshub.labels" $root | nindent 4 }}
    app.kubernetes.io/component: health-aggregator
spec:
  minAvailable: {{ $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: health-aggregator
---
{{- end }}
{{- end }}
