{{- $ha := .Values.healthAggregator | default dict -}}
{{- $repo := default "" $ha.image.repository -}}
{{- $digest := default "" $ha.image.digest -}}
{{- $digestValid := eq (include "accesshub.validDigest" (dict "digest" $digest)) "true" -}}
{{- if and .Values.ingress.enabled $ha.enabled $ha.ingress.enabled (ne $repo "") $digestValid }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "accesshub.fullname" . }}-health-aggregator
  labels:
    {{- include "accesshub.labels" . | nindent 4 }}
    app.kubernetes.io/component: health-aggregator
  {{- if or .Values.ingress.annotations $ha.ingress.healthCheckPath }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $ha.ingress.healthCheckPath }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ $ha.ingress.healthCheckPath | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ default "/region-healthz" $ha.ingress.path }}
            pathType: {{ default "Prefix" $ha.ingress.pathType }}
            backend:
              service:
                name: {{ include "accesshub.fullname" . }}-health-aggregator
                port:
                  number: {{ default 80 $ha.service.port }}
{{- end }}
