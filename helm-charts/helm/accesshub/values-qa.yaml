ingress:
  enabled: true
  className: alb
  host: ''
  frontendHealthCheckPath: /accesshub/
  backendHealthCheckPath: /actuator/health
  backendHealthCheckPaths:
    ahschedular: /jobschedular/health
    scimpersist: /scim-application/health
    adminsvc: /privilegedrole/health
    apponbsvc: /itasset/health
    loginmodsvc: /RequestJWTToken/health
    gatewaysvc: /scim/health
    pgmodsvc: /pgmodule/health
    ahservicesvc: /ahservices/api/health
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: accesshub-qa-alb
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=qa-accesshub-alb-access-logs-495711089104-eu-west-1,access_logs.s3.prefix=alb/accesshub,deletion_protection.enabled=false,idle_timeout.timeout_seconds=1800
    alb.ingress.kubernetes.io/wafv2-acl-arn: REPLACE_WITH_QA_WAF_ARN
    alb.ingress.kubernetes.io/group.name: accesshub-qa
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_QA_CERT_ARN
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/listener-attributes.HTTPS-443: routing.http.response.server.enabled=false,routing.http.response.x_content_type_options.header_value=nosniff,routing.http.response.x_frame_options.header_value=SAMEORIGIN,routing.http.response.access_control_allow_origin.header_value=https://qa.accesshub-identity.com,routing.http.response.access_control_allow_methods.header_value=GET,POST,PUT,DELETE,OPTIONS,routing.http.response.access_control_allow_headers.header_value=Content-Type,Authorization,routing.http.response.access_control_allow_credentials.header_value=true
