# QA (eu-west-1) — derived from values-prod.yaml with every prod value swapped
# for QA's own. Digests below are seeded from prod so the first sync has
# runnable images; build-from-app-repo.yml overwrites them on the first push
# to customer/ah_booking_qa.
#
# Before the first sync, replace the two placeholders from Terraform outputs:
#   REPLACE_WITH_QA_CERT_ARN: envs/qa/eu-west-1/acm/accesshub-identity  -> terraform output -raw certificate_arn
#   REPLACE_WITH_QA_WAF_ARN:  envs/qa/eu-west-1/waf-accesshub           -> terraform output -raw web_acl_arn
# build-from-app-repo.yml refuses to run for QA while either is still present.
global:
  imageRegistry: 495711089104.dkr.ecr.eu-west-1.amazonaws.com
  extraEnv:
   - name: OTEL_JAVAAGENT_LOGGING
     value: none
  runtime:
    existingSecret: accesshub-runtime
    baseUrl: ''
    tenantId: ''
    nativeSuperadminId: ''
    nativeSuperadminPassword: ''
    grcApiAccessUser: ''
    grcApiAccessPassword: ''
  database:
    configMap:
      create: true
      name: accesshub-db-config
    host: db-primary.accesshub.internal
    name: accesshub
externalSecret:
  data:
    username:
      remoteRef:
        key: qa/aurora/app-credentials
        property: username
    password:
      remoteRef:
        key: qa/aurora/app-credentials
        property: password
