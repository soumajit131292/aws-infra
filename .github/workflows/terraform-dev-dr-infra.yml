  alb_controller:
    name: EKS Add-on - ALB Controller
    needs: [eks, github_runner]
    runs-on: [self-hosted, infra, private-vpc]
    defaults:
      run:
        working-directory: envs/dev-dr/eks-add-on/alb-controller
