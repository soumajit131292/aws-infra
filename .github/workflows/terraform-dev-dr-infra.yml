name: Terraform Dev DR Infra

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (false = plan only)"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "envs/dev-dr/**"
      - "envs/dev/github-oidc-role/**"
      - "modules/**"
      - ".github/workflows/terraform-dev-dr-infra.yml"
  pull_request:
    paths:
      - "envs/dev-dr/**"
      - "envs/dev/github-oidc-role/**"
      - "modules/**"
      - ".github/workflows/terraform-dev-dr-infra.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

concurrency:
  group: terraform-dev-dr-infra
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap DR (ECR lifecycle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev-dr/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform init -reconfigure
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply == true)
        run: terraform apply -auto-approve tfplan

  github_oidc_role:
    name: GitHub OIDC Role
    needs: [bootstrap]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev/github-oidc-role
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform init -reconfigure
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply == true)
        run: terraform apply -auto-approve tfplan

  vpc:
    name: VPC
    needs: [bootstrap]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev-dr/vpc
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform init -reconfigure
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply == true)
        run: terraform apply -auto-approve tfplan

  eks:
    name: EKS (control plane + managed node groups)
    needs: [vpc]
    runs-on: [self-hosted, infra, private-vpc]
    defaults:
      run:
        working-directory: envs/dev-dr/eks
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
