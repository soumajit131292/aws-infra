        run: terraform apply -auto-approve tfplan

  external_secrets:
    name: EKS Add-on - External Secrets
    needs: [eks, github_runner]
    runs-on: [self-hosted, infra, private-vpc]
    defaults:
      run:
        working-directory: envs/dev-dr/eks-add-on/external-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
