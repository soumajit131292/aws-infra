---
plugin: amazon.aws.aws_ec2
strict: false
regions:
  - us-east-1

filters:
  tag:Name: dev-ubuntu-tools
  instance-state-name: running

hostnames:
  - instance-id

compose:
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_user: "'ssm-user'"
  ansible_remote_tmp: "'/tmp/.ansible/tmp'"
  ansible_aws_ssm_region: "'us-east-1'"
  # Required by amazon.aws.aws_ssm to stage module payloads.
  ansible_aws_ssm_bucket_name: "'crave-infra-terraform-state-bucket'"

groups:
  ubuntu_vm: "tags.Name is defined and tags.Name == 'dev-ubuntu-tools'"
