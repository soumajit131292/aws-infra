---
- name: Fail if not Ubuntu
  fail:
    msg: "This role supports Ubuntu only."
  when: ansible_distribution != "Ubuntu"

- name: Set binary architecture suffix
  set_fact:
    devops_tools_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    # AWS CLI names its packages by kernel arch, not Go arch.
    devops_tools_awscli_arch: "{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"

############################
# APT HARDENING
############################

- name: Configure apt retry + IPv4
  copy:
    dest: /etc/apt/apt.conf.d/99hardening
    mode: "0644"
    content: |
      Acquire::ForceIPv4 "true";
      Acquire::Retries "3";
      Acquire::http::Timeout "20";
      Acquire::https::Timeout "20";

- name: Install base packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - unzip
      - tar
    state: present
    update_cache: true

############################
# DOCKER (Pinned + Fingerprint Verified)
############################

- name: Ensure keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Validate Docker GPG fingerprint
  shell: |
    gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc | awk -F: '/^fpr/ {print $10; exit}'
  register: docker_fpr
  changed_when: false

- name: Fail if Docker fingerprint mismatch
  fail:
    msg: "Docker GPG fingerprint mismatch!"
  when: docker_fpr.stdout != devops_tools_docker_gpg_expected_fingerprint

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ devops_tools_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

# Hold is lifted first so a version bump in defaults can be applied; it is
# re-applied below. No fallback: an unavailable pin fails the run instead of
# silently installing whatever is latest.
- name: Release Docker package hold
  command: apt-mark unhold docker-ce docker-ce-cli
  changed_when: false
  failed_when: false

- name: Install pinned Docker version
  apt:
    name:
      - "docker-ce={{ devops_tools_docker_version }}"
      - "docker-ce-cli={{ devops_tools_docker_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Hold Docker packages
  command: apt-mark hold docker-ce docker-ce-cli
  changed_when: false

# systemctl via shell instead of the service/systemd module: over the
# amazon.aws.aws_ssm connection that module fails with "Cannot send input
# after starting communication", while plain commands work.
- name: Ensure Docker enabled and running
  shell: |
    set -eu
    changed=0
    systemctl is-enabled --quiet docker || { systemctl enable docker; changed=1; }
    systemctl is-active --quiet docker || { systemctl start docker; changed=1; }
    echo "changed=$changed"
  register: docker_service
  changed_when: "'changed=1' in docker_service.stdout"

- name: Validate Docker health
  command: docker info
  changed_when: false

############################
# KUBECTL (pinned version + pinned SHA256)
############################

- name: Check kubectl version
  command: kubectl version --client --output=json
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Determine if kubectl install required
  set_fact:
    kubectl_install_required: >-
      {{ kubectl_check.rc != 0
         or (kubectl_check.stdout | from_json).clientVersion.gitVersion != ('v' ~ devops_tools_kubectl_version) }}

- name: Download kubectl (checksum verified)
  get_url:
    url: "https://dl.k8s.io/release/v{{ devops_tools_kubectl_version }}/bin/linux/{{ devops_tools_arch }}/kubectl"
    dest: /usr/local/bin/kubectl
    checksum: "sha256:{{ devops_tools_kubectl_sha256[devops_tools_arch] }}"
    mode: "0755"
    force: true
  when: kubectl_install_required

############################
# TERRAFORM (pinned version + pinned SHA256)
############################

- name: Check terraform version
  command: terraform version -json
  register: terraform_check
  changed_when: false
  failed_when: false

- name: Determine if terraform install required
  set_fact:
    terraform_install_required: >-
      {{ terraform_check.rc != 0
         or (terraform_check.stdout | from_json).terraform_version != devops_tools_terraform_version }}

- name: Install terraform
  when: terraform_install_required
  block:
    - name: Download terraform zip (checksum verified)
      get_url:
        url: "https://releases.hashicorp.com/terraform/{{ devops_tools_terraform_version }}/terraform_{{ devops_tools_terraform_version }}_linux_{{ devops_tools_arch }}.zip"
        dest: "/tmp/terraform_{{ devops_tools_terraform_version }}_linux_{{ devops_tools_arch }}.zip"
        checksum: "sha256:{{ devops_tools_terraform_sha256[devops_tools_arch] }}"
        mode: "0644"

    - name: Extract terraform binary
      unarchive:
        src: "/tmp/terraform_{{ devops_tools_terraform_version }}_linux_{{ devops_tools_arch }}.zip"
        dest: /usr/local/bin/
        include: [terraform]
        remote_src: true
  always:
    - name: Remove terraform download
      file:
        path: "/tmp/terraform_{{ devops_tools_terraform_version }}_linux_{{ devops_tools_arch }}.zip"
        state: absent

############################
# HELM (pinned version + pinned SHA256)
############################

- name: Check helm version
  command: helm version --template "{{ '{{' }} .Version {{ '}}' }}"
  register: helm_check
  changed_when: false
  failed_when: false

- name: Determine if helm install required
  set_fact:
    helm_install_required: "{{ helm_check.rc != 0 or (helm_check.stdout | trim) != ('v' ~ devops_tools_helm_version) }}"

- name: Install helm
  when: helm_install_required
  block:
    - name: Download helm archive (checksum verified)
      get_url:
        url: "https://get.helm.sh/helm-v{{ devops_tools_helm_version }}-linux-{{ devops_tools_arch }}.tar.gz"
        dest: /tmp/helm.tar.gz
        checksum: "sha256:{{ devops_tools_helm_sha256[devops_tools_arch] }}"
        mode: "0644"

    - name: Extract helm archive
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install helm binary
      copy:
        src: "/tmp/linux-{{ devops_tools_arch }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
  always:
    - name: Remove helm download
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/helm.tar.gz
        - "/tmp/linux-{{ devops_tools_arch }}"

############################
# AWS CLI (pinned version + PGP signature verified)
############################

- name: Check AWS CLI version
  command: aws --version
  register: aws_check
  changed_when: false
  failed_when: false

# `aws --version` prints e.g. "aws-cli/2.40.2 Python/3.13 Linux/..."
- name: Determine if AWS CLI install required
  set_fact:
    awscli_install_required: >-
      {{ aws_check.rc != 0
         or (aws_check.stdout | regex_search('aws-cli/([0-9.]+)', '\\1') | first) != devops_tools_awscli_version }}

- name: Install AWS CLI
  when: awscli_install_required
  block:
    - name: Create temporary GnuPG home
      tempfile:
        state: directory
        suffix: awscli-gpg
      register: awscli_gnupghome

    - name: Copy AWS CLI public key
      copy:
        src: awscli-public-key.asc
        dest: "{{ awscli_gnupghome.path }}/awscli.asc"
        mode: "0600"

    - name: Verify AWS CLI public key fingerprint
      shell: |
        gpg --show-keys --with-colons "{{ awscli_gnupghome.path }}/awscli.asc" | awk -F: '/^fpr/ {print $10; exit}'
      register: awscli_key_fpr
      changed_when: false

    - name: Fail if AWS CLI key fingerprint mismatch
      fail:
        msg: "AWS CLI public key fingerprint mismatch: {{ awscli_key_fpr.stdout }}"
      when: awscli_key_fpr.stdout != devops_tools_awscli_gpg_fingerprint

    - name: Download AWS CLI package and signature
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ devops_tools_awscli_arch }}-{{ devops_tools_awscli_version }}.zip{{ item.ext }}"
        dest: "{{ awscli_gnupghome.path }}/awscliv2.zip{{ item.ext }}"
        mode: "0644"
      loop:
        - { ext: "" }
        - { ext: ".sig" }

    - name: Verify AWS CLI package signature
      shell: |
        set -eu
        export GNUPGHOME="{{ awscli_gnupghome.path }}"
        gpg --batch --quiet --import awscli.asc
        gpg --batch --status-fd 1 --verify awscliv2.zip.sig awscliv2.zip | grep -q "^\[GNUPG:\] VALIDSIG {{ devops_tools_awscli_gpg_fingerprint }} "
      args:
        chdir: "{{ awscli_gnupghome.path }}"
      changed_when: false

    - name: Extract AWS CLI
      unarchive:
        src: "{{ awscli_gnupghome.path }}/awscliv2.zip"
        dest: "{{ awscli_gnupghome.path }}"
        remote_src: true

    - name: Install AWS CLI
      command: "{{ awscli_gnupghome.path }}/aws/install --update"
  always:
    - name: Remove AWS CLI install workspace
      file:
        path: "{{ awscli_gnupghome.path }}"
        state: absent
      when: awscli_gnupghome.path is defined
